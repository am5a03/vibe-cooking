name: Deploy to Cloudflare Workers

on:
  push:
    branches: ['main']
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to publish this commit. Apply reviewed migrations separately first.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kitchen-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'DEPLOY' && github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require a reviewed lockfile
        run: test -f package-lock.json && npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run deploy
