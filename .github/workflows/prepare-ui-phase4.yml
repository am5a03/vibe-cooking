# Temporary branch-only preparation; removed from the final PR diff.
name: Prepare UI phase 4
on:
  push:
    branches: ['feat/shadcn-phase-4-confirmations']
    paths: ['.github/workflows/prepare-ui-phase4.yml']
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'am5a03/vibe-cooking' && github.ref == 'refs/heads/feat/shadcn-phase-4-confirmations'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/shadcn-phase-4-confirmations
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      # Baseline already passed in run 35392679064, before its CLI prompt failure.
      - name: Generate alert dialog and restore every existing component
        run: |
          npx --yes shadcn@4.21.0 add alert-dialog --yes --overwrite
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'components/ui/alert-dialog.tsx';
          writeFileSync(path, readFileSync(path, 'utf8').replaceAll('from "cn"', 'from "@/lib/utils"'));
          NODE
          git restore package.json package-lock.json components.json app/globals.css components/ui/button.tsx
          npx biome format --write components/ui/alert-dialog.tsx
          npm ci
      - name: Commit primitive and remove preparation workflow
        run: |
          rm .github/workflows/prepare-ui-phase4.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/ui/alert-dialog.tsx .github/workflows/prepare-ui-phase4.yml
          git diff --cached --check
          git commit -m 'feat(ui): add shadcn alert dialog primitive'
          git push origin HEAD:refs/heads/feat/shadcn-phase-4-confirmations
      - name: Package tracked source and dependencies for local verification
        run: |
          mkdir -p /tmp/ui-phase4-source
          git archive --format=tar.gz HEAD > /tmp/ui-phase4-source/source.tar.gz
          tar -czf /tmp/ui-phase4-source/dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: ui-phase4-source
          path: /tmp/ui-phase4-source/
          retention-days: 7
