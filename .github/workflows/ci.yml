name: CI
on:
  pull_request:
  push:
    branches: ['main']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kitchen-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        id: install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Preserve resolved dependency lock for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lock
          path: package-lock.json
          if-no-files-found: ignore
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - name: Test API, sessions and migrations
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: Validate starter catalogue without writing data
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run catalogue:import
      - name: Audit dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm audit --audit-level=high
      - name: Build for Workers (no deployment)
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build:worker
      - name: Validate Worker bundle without deploying
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npx wrangler deploy --dry-run
      - name: Install test browser
        id: browser
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npx playwright install --with-deps chromium
      - name: Browser workflow on isolated local Workers and D1
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node scripts/browser-check.mjs
      - name: Preserve browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kitchen-browser-results
          path: test-results/
          if-no-files-found: ignore
