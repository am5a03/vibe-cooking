# Temporary branch-only preparation; removed from the final pull request diff.
name: Prepare UI phase 3
on:
  push:
    branches: ['feat/shadcn-phase-3-recipes']
    paths: ['.github/workflows/prepare-ui-phase3.yml']
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'am5a03/vibe-cooking' && github.ref == 'refs/heads/feat/shadcn-phase-3-recipes'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/shadcn-phase-3-recipes
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Verify merged baseline
        run: npm run typecheck && npm run lint && npm test && npm run build:worker
      - run: npx playwright install --with-deps chromium
      - name: Baseline browser workflows on disposable local D1
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: ui-phase3-before
          path: test-results/
      - name: Add required New York primitives without overwriting existing source or theme
        run: |
          npx --yes shadcn@latest add textarea native-select checkbox collapsible --yes
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          for (const name of ['textarea', 'native-select', 'checkbox', 'collapsible']) {
            const path = `components/ui/${name}.tsx`;
            writeFileSync(path, readFileSync(path, 'utf8').replaceAll('from "cn"', 'from "@/lib/utils"'));
          }
          NODE
          npm uninstall cn --ignore-scripts --no-audit --no-fund
          npm install --save-exact --ignore-scripts --no-audit --no-fund radix-ui@1.6.7
          npx biome format --write components/ui/textarea.tsx components/ui/native-select.tsx components/ui/checkbox.tsx components/ui/collapsible.tsx
          git diff --exit-code -- app/globals.css components.json
      - name: Commit generated primitives and remove preparation workflow
        run: |
          rm .github/workflows/prepare-ui-phase3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/ui/textarea.tsx components/ui/native-select.tsx components/ui/checkbox.tsx components/ui/collapsible.tsx package.json package-lock.json .github/workflows/prepare-ui-phase3.yml
          git commit -m 'feat(ui): add shadcn controls for recipe screens'
          git push origin HEAD:refs/heads/feat/shadcn-phase-3-recipes
      - name: Package source for review
        run: |
          mkdir -p /tmp/ui-phase3-review
          git archive HEAD | gzip > /tmp/ui-phase3-review/source.tar.gz
          tar -czf /tmp/ui-phase3-review/node-tools.tar.gz node_modules/typescript node_modules/@biomejs node_modules/tsx node_modules/esbuild node_modules/@esbuild node_modules/get-tsconfig node_modules/resolve-pkg-maps node_modules/postcss node_modules/nanoid node_modules/picocolors node_modules/source-map-js
      - uses: actions/upload-artifact@v4
        with:
          name: ui-phase3-source
          path: /tmp/ui-phase3-review/
          retention-days: 7
