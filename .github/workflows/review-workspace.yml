name: Review workspace
on:
  pull_request:
permissions:
  contents: read
jobs:
  snapshot:
    if: github.head_ref == 'feat/discovery-remixes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Package tracked source and installed public packages for offline checks
        run: |
          git archive --format=tar HEAD > /tmp/review-source.tar
          tar -rf /tmp/review-source.tar package-lock.json
          gzip /tmp/review-source.tar
          tar -czf /tmp/review-dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: review-workspace
          path: |
            /tmp/review-source.tar.gz
            /tmp/review-dependencies.tar.gz
          retention-days: 1
