# Temporary, read-only authoring check. Removed once generated files are reviewed.
name: Prepare Drizzle integration review
on:
  pull_request:
    branches: [main]
    paths: ['db/schema.ts', '.github/workflows/drizzle-review.yml']
permissions:
  contents: read
jobs:
  prepare:
    if: github.head_ref == 'feat/discovery-remixes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Generate the new schema snapshot and separate custom guard migration
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, mkdirSync, unlinkSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const legacy = readFileSync('drizzle/migrations/0003_recipe_remixes.sql', 'utf8');
          mkdirSync('tests/fixtures', { recursive: true });
          writeFileSync('tests/fixtures/legacy-0003-recipe-remixes.sql', legacy);
          unlinkSync('drizzle/migrations/0003_recipe_remixes.sql');
          execFileSync('npm', ['run', 'db:generate', '--', '--name=recipe_remixes'], { stdio: 'inherit' });
          const tablePath = 'drizzle/migrations/0004_recipe_remixes.sql';
          let tableSql = readFileSync(tablePath, 'utf8');
          if (/\b(?:DROP|ALTER)\b/i.test(tableSql)) throw new Error('Unexpected changes to existing tables; review the generated diff.');
          tableSql = '-- Generated by pinned Drizzle Kit; IF NOT EXISTS also accepts the original PR #5 preview table.\n' + tableSql.replace(/CREATE TABLE /g, 'CREATE TABLE IF NOT EXISTS ').replace(/CREATE INDEX /g, 'CREATE INDEX IF NOT EXISTS ').replace(/CREATE UNIQUE INDEX /g, 'CREATE UNIQUE INDEX IF NOT EXISTS ');
          writeFileSync(tablePath, tableSql);
          execFileSync('npm', ['run', 'db:generate:custom', '--', '--name=recipe_remix_guards'], { stdio: 'inherit' });
          const guardSql = legacy.slice(legacy.indexOf('-- Check again')).replace(/CREATE TRIGGER /g, 'CREATE TRIGGER IF NOT EXISTS ');
          writeFileSync('drizzle/migrations/0005_recipe_remix_guards.sql', '-- Custom SQLite triggers are intentionally outside Drizzle snapshots.\n' + guardSql);
          execFileSync('npm', ['run', 'db:migrations:check'], { stdio: 'inherit' });
          NODE
      - name: Package tracked source and generated files for review (no secrets or database state)
        run: |
          mkdir -p review-output
          git archive --format=tar HEAD > review-output/source.tar
          tar -rf review-output/source.tar drizzle/migrations/0004_recipe_remixes.sql drizzle/migrations/0005_recipe_remix_guards.sql drizzle/migrations/meta tests/fixtures/legacy-0003-recipe-remixes.sql
          gzip review-output/source.tar
          cp -R drizzle/migrations review-output/migrations
      - uses: actions/upload-artifact@v4
        with:
          name: drizzle-integration-review
          path: review-output/
          retention-days: 3
