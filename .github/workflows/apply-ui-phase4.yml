# Temporary source transfer; removed from the final PR diff.
name: Apply reviewed UI phase 4
on:
  push:
    branches: ['feat/shadcn-phase-4-confirmations']
    paths: ['.github/workflows/apply-ui-phase4.yml']
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'am5a03/vibe-cooking' && github.ref == 'refs/heads/feat/shadcn-phase-4-confirmations'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/shadcn-phase-4-confirmations
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and apply source hashes before writing any files
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync, mkdirSync, existsSync } from 'node:fs';
          import { dirname } from 'node:path';
          import { createHash } from 'node:crypto';
          import { inflateSync } from 'node:zlib';
          const hash = (data) => createHash('sha256').update(data).digest('hex');
          const compressed = Buffer.from(readFileSync('scripts/_phase4.b64', 'utf8').trim(), 'base64');
          assert.equal(hash(compressed), 'eeeeef435a223cb94fbd2ab4366567f03a56ba46d4462d234b6817d6b7e537b5');
          const bundle = JSON.parse(inflateSync(compressed).toString('utf8'));
          assert.equal(bundle.base, '60147f884b6957656a8baed56d4f677b03ddd2b0');
          const allowed = new Set([
            'components/kitchen/editor.tsx', 'components/kitchen/preferences.tsx',
            'components/kitchen/recipe.tsx', 'components/kitchen/remixes.tsx',
            'components/kitchen/studio.tsx', 'components/kitchen/unlock.tsx',
            'components/ui/PROVENANCE.md', 'docs/UI.md',
            'tests/browser/management.spec.ts', 'tests/browser/ui-shell.spec.ts',
            'components/kitchen/confirmation-state.ts', 'components/kitchen/confirmation.tsx',
            'tests/browser/zzz-confirmations.spec.ts', 'tests/confirmation.test.mjs',
          ]);
          assert.equal(bundle.files.length, allowed.size);
          const ready = [];
          for (const file of bundle.files) {
            assert.ok(allowed.delete(file.path), `Unexpected path: ${file.path}`);
            let output;
            if (file.before === null) {
              assert.equal(existsSync(file.path), false, file.path);
              output = file.content;
            } else {
              const input = readFileSync(file.path, 'utf8');
              assert.equal(hash(input), file.before, `Changed source: ${file.path}`);
              const lines = input.match(/[^\n]*\n|[^\n]+$/g) ?? [];
              for (const [start, end, text] of [...file.edits].sort((a, b) => b[0] - a[0])) {
                assert.ok(Number.isInteger(start) && Number.isInteger(end) && start >= 0 && end >= start && end <= lines.length);
                lines.splice(start, end - start, text);
              }
              output = lines.join('');
            }
            assert.equal(hash(output), file.after, `Output mismatch: ${file.path}`);
            ready.push([file.path, output]);
          }
          assert.equal(allowed.size, 0);
          for (const [path, output] of ready) {
            mkdirSync(dirname(path), { recursive: true });
            writeFileSync(path, output);
          }
          console.log(`Verified and applied ${ready.length} files.`);
          NODE
      - name: Commit implementation and remove temporary transfer files
        run: |
          rm scripts/_phase4.b64 .github/workflows/apply-ui-phase4.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/kitchen components/ui/PROVENANCE.md docs/UI.md tests scripts/_phase4.b64 .github/workflows/apply-ui-phase4.yml
          git diff --cached --check
          git commit -m 'feat(ui): migrate confirmations and protect session-aware actions'
          git push origin HEAD:refs/heads/feat/shadcn-phase-4-confirmations
      - run: npm ci
      - name: Check final source
        run: npm run typecheck && npm run lint && npm test
