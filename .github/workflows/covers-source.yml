name: Cover development source
on:
  push:
    branches: ['feat/public-recipe-covers']
    paths: ['.github/workflows/covers-source.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive tracked source only
        run: git archive HEAD --format=tar.gz -o covers-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: covers-source
          path: covers-source.tar.gz
          retention-days: 1
