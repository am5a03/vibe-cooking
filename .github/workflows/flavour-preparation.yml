name: Flavour development baseline
on:
  push:
    branches: ['feat/flavour-library']
    paths: ['.github/workflows/flavour-preparation.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci
      - run: npm run typecheck && npm test && npm run lint
      - name: Package tracked source and locked development dependencies
        run: |
          git archive --format=tar.gz HEAD -o /tmp/flavour-source.tar.gz
          tar -czf /tmp/flavour-dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: flavour-development-baseline
          path: |
            /tmp/flavour-source.tar.gz
            /tmp/flavour-dependencies.tar.gz
          retention-days: 1
          compression-level: 0
