# Temporary branch-only application of reviewed source; removed in its own commit.
name: Apply reviewed UI phase 3
on:
  push:
    branches: ['feat/shadcn-phase-3-recipes']
    paths: ['.github/workflows/apply-ui-phase3.yml']
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'am5a03/vibe-cooking' && github.ref == 'refs/heads/feat/shadcn-phase-3-recipes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/shadcn-phase-3-recipes
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Verify and apply reviewed changes without touching domain or deployment code
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync, existsSync, mkdirSync } from 'node:fs';
          import { dirname } from 'node:path';
          import { createHash } from 'node:crypto';
          import { brotliDecompressSync } from 'node:zlib';
          import { execFileSync } from 'node:child_process';
          const hash = (value) => createHash('sha256').update(value).digest('hex');
          const encoded = [1, 2, 3].map((n) => readFileSync(`scripts/_phase3/part${n}.b64`, 'utf8').trim()).join('');
          const compressed = Buffer.from(encoded, 'base64');
          assert.equal(hash(compressed), '7b3363d0013445a8cffb5594731822d72ffa3b6d577cdff7a47b09f2405f115b');
          const bundle = JSON.parse(brotliDecompressSync(compressed).toString('utf8'));
          assert.equal(bundle.base, '9b560efcd026d18c4dfcd63b9d993415bd673d3b');
          const allowed = new Set([
            'components/kitchen/browser.tsx', 'components/kitchen/discovery.tsx',
            'components/kitchen/dish-art.tsx', 'components/kitchen/editor.tsx',
            'components/kitchen/notice.tsx', 'components/kitchen/preferences.tsx',
            'components/kitchen/recipe-card.tsx', 'components/kitchen/recipe.tsx',
            'components/kitchen/remixes.tsx', 'components/kitchen/shared.tsx',
            'components/ui/PROVENANCE.md', 'components/ui/native-select.tsx',
            'docs/UI.md', 'tests/browser/ui-shell.spec.ts',
            'tests/browser/zz-ui-recipes.spec.ts', 'tests/helpers/ui-components.ts',
            'tests/ui-recipes.test.mjs', 'tests/ui-shell.test.mjs',
          ]);
          assert.equal(bundle.files.length, allowed.size);
          const ready = [];
          for (const file of bundle.files) {
            assert.ok(allowed.delete(file.path), `Unexpected or repeated path: ${file.path}`);
            let output;
            if (file.before === null) {
              assert.equal(existsSync(file.path), false, `New path already exists: ${file.path}`);
              output = file.content;
            } else {
              let source = readFileSync(file.path, 'utf8');
              assert.equal(hash(source), file.before, `Source changed: ${file.path}`);
              if (file.format) source = execFileSync('node', ['node_modules/@biomejs/biome/bin/biome', 'format', '--stdin-file-path', file.path], { input: source, encoding: 'utf8' });
              assert.equal(hash(source), file.formatted, `Formatting mismatch: ${file.path}`);
              const lines = source.match(/[^\n]*\n|[^\n]+$/g) ?? [];
              for (const [start, end, text] of [...file.edits].sort((a, b) => b[0] - a[0])) {
                assert.ok(Number.isInteger(start) && Number.isInteger(end) && start >= 0 && end >= start && end <= lines.length);
                lines.splice(start, end - start, text);
              }
              output = lines.join('');
            }
            assert.equal(hash(output), file.after, `Output mismatch: ${file.path}`);
            ready.push([file.path, output]);
          }
          assert.equal(allowed.size, 0);
          for (const [path, output] of ready) {
            mkdirSync(dirname(path), { recursive: true });
            writeFileSync(path, output);
          }
          console.log(`Verified and applied ${ready.length} reviewed source files.`);
          NODE
      - name: Commit reviewed files and remove temporary transfer files
        run: |
          rm -r scripts/_phase3
          rm .github/workflows/apply-ui-phase3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/kitchen components/ui/PROVENANCE.md components/ui/native-select.tsx docs/UI.md tests scripts/_phase3 .github/workflows/apply-ui-phase3.yml
          git diff --cached --check
          git commit -m 'feat(ui): migrate recipe screens to shadcn'
          git push origin HEAD:refs/heads/feat/shadcn-phase-3-recipes
      - name: Verify static checks and Node suite
        run: npm run typecheck && npm run lint && npm test
