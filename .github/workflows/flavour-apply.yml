name: Apply verified flavour implementation
on:
  push:
    branches: ['feat/flavour-library']
    paths:
      - '.github/workflows/flavour-apply.yml'
      - '.flavour-transfer/corrections.json'
permissions:
  contents: write
concurrency:
  group: flavour-implementation-transfer
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'am5a03/vibe-cooking' && github.ref == 'refs/heads/feat/flavour-library'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Preserve transport for byte verification
        run: |
          python - <<'PY'
          import pathlib, zipfile
          with zipfile.ZipFile('/tmp/flavour-transfer.zip', 'w') as z:
            for p in pathlib.Path('.flavour-transfer').iterdir():
              if p.is_file(): z.write(p, p.name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: flavour-transfer-verification
          path: /tmp/flavour-transfer.zip
          retention-days: 1
      - name: Verify exact locally tested patch
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json, pathlib
          names = ['part1', 'part2', 'correct3'] + ['final' + str(n) for n in range(1, 7)]
          chunks = {n: ''.join(pathlib.Path('.flavour-transfer', n).read_text().split()) for n in names}
          corrections = pathlib.Path('.flavour-transfer/corrections.json')
          if corrections.exists():
            for n, c in json.loads(corrections.read_text()).items():
              s = chunks[n]
              assert hashlib.sha256(s.encode()).hexdigest() == c['input_sha256'], n
              for e in sorted(c['edits'], key=lambda e: e['start'], reverse=True):
                assert s[e['start']:e['end']] == e['old'], n
                s = s[:e['start']] + e['new'] + s[e['end']:]
              chunks[n] = s
          patch = gzip.decompress(base64.b64decode(''.join(chunks[n] for n in names), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '8849e786d6d47873aad4849ec6749d814028c13fe7ee56be3ca654a6fb77f311', 'Patch bytes must match the locally tested source'
          pathlib.Path('/tmp/flavour-feature.patch').write_bytes(patch)
          print('Exact feature patch verified.')
          PY
      - name: Apply only on the inspected source baseline
        run: |
          git diff --exit-code a330fe95ae8441478dfcb7848cf153a186d55f79 HEAD -- AGENTS.md README.md components db docs drizzle examples lib tests
          git apply --check /tmp/flavour-feature.patch
          git apply /tmp/flavour-feature.patch
          git diff --check
      - run: npm ci
      - run: npm run typecheck && npm test && npm run lint && npm run db:migrations:check
      - name: Commit ordinary source only to the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md README.md components db docs drizzle examples lib tests
          git commit -m 'feat: add D1 flavour library, curated profiles and friendly recipe selectors'
          git push origin HEAD:refs/heads/feat/flavour-library
