name: Apply verified public cover implementation
on:
  push:
    branches: ['feat/public-recipe-covers']
    paths: ['.github/workflows/covers-apply.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/public-recipe-covers
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify transported source bytes before applying
        run: |
          python - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          hashes = ['ab9508a73569166a69eed05464f6662c7f2b3db37a0abbab7f91075f1a32a2fe','2402c6820167b46b8283d93d4f2300b4f938cff916f9dc0dd62848510a75dc6f','dd900b1397644596f99c13c978f7750ecdfc9ffabd8980efa68cf59bb73df1e7','6c38880ab412c968ce69323a0b7b7a233b36bebbddf337122db4008ed7c3ad93','88b8d8047468c370b4939cebe1d4482b8a8600ad02014cef1adc0a75d618b0a1']
          parts = []
          for index, expected in enumerate(hashes):
              data = Path(f'.covers-part-{index:02d}.txt').read_text().strip()
              if index == 2:
                  # Restore two known transcription errors; exact hash is mandatory.
                  data = data.replace('RFffbW1W8//iC/', 'RFffbW1W//iC/').replace('ODsQ2F9oWf/0rP62F62uw', 'ODsQ2F9oWf/0rP62F/uw')
              actual = hashlib.sha256(data.encode()).hexdigest()
              print(index, len(data), actual)
              assert actual == expected, f'Transfer chunk {index} mismatch'
              parts.append(data)
          patch = gzip.decompress(base64.b64decode(''.join(parts), validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'e66f0517731a4d3279e725ac546ff6a40435e242f4bf90ade76c58e751306688'
          Path('/tmp/covers-feature.patch').write_bytes(patch)
          PY
          git apply --check /tmp/covers-feature.patch
          git apply --index /tmp/covers-feature.patch
      - name: Materialize and verify original public SVG files
        run: |
          node scripts/draw-seed-covers.mjs
          python - <<'PY'
          from pathlib import Path
          import hashlib
          files = sorted(Path('public/images/recipes').glob('*.svg'))
          assert len(files) == 12
          digest = hashlib.sha256(b''.join(p.read_bytes() for p in files)).hexdigest()
          print('Public cover digest:', digest)
          assert digest == '1d7a007ec88c95a1282dc2ec9a70fdab92b79a3426a0daedbe5319215377c04e'
          PY
          git add public/images/recipes
      - name: Commit only verified implementation and remove transport files
        run: |
          git rm .covers-part-*.txt .github/workflows/covers-apply.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add public recipe covers and preview-first seed image attachment'
          git push origin HEAD:feat/public-recipe-covers
