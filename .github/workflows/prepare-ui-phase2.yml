# Temporary branch-only normalization; removed before the final PR.
name: Prepare UI phase 2
on:
  push:
    branches: ['feat/shadcn-phase-2-shell']
    paths: ['.github/workflows/prepare-ui-phase2.yml']
permissions:
  contents: read
jobs:
  normalize:
    if: github.repository == 'am5a03/vibe-cooking' && github.ref == 'refs/heads/feat/shadcn-phase-2-shell'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Use the existing class helper and stable generated error keys
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync, readdirSync, appendFileSync } from 'node:fs';
          for (const file of readdirSync('components/ui').filter((file) => file.endsWith('.tsx'))) {
            const path = `components/ui/${file}`;
            let source = readFileSync(path, 'utf8').replaceAll('from "cn"', 'from "@/lib/utils"');
            if (file === 'field.tsx') source = source.replace('(error, index)', '(error)').replace('key={index}', 'key={error.message}');
            writeFileSync(path, source);
          }
          appendFileSync('components/ui/PROVENANCE.md', '\nLocal adjustments: use the existing @/lib/utils cn helper instead of an additional cn package; use unique error messages as FieldError keys rather than array indexes; apply repository formatting.\n');
          EOF
          npm uninstall cn --ignore-scripts --no-audit --no-fund
          npm install --package-lock-only --ignore-scripts --save-exact --no-audit --no-fund radix-ui@1.6.7
          npx biome format --write components/ui components/kitchen/unlock.tsx components/kitchen/kitchen-header.tsx tests/browser/ui-shell.spec.ts tests/ui-shell.test.mjs
      - name: Commit final preparation changes and remove this workflow
        run: |
          rm .github/workflows/prepare-ui-phase2.yml
          git add -A -- components/ui components/kitchen/unlock.tsx components/kitchen/kitchen-header.tsx tests/browser/ui-shell.spec.ts tests/ui-shell.test.mjs package.json package-lock.json .github/workflows/prepare-ui-phase2.yml
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(ui): reuse local cn, pin Radix and finalize component source'
          git push origin HEAD:refs/heads/feat/shadcn-phase-2-shell
